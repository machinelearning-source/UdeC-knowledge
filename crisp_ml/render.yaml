services:
  - type: web
    name: knowbot-reranker
    runtime: python
    plan: free
    # The embedding model is downloaded during the build, so the first request does not wait for it.
    buildCommand: pip install -r requirements.txt && python -c "from knowbot.retrieval import load_corpus; load_corpus()"
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
