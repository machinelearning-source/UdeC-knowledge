services:
  - type: web
    name: udec-knowledge
    runtime: python
    buildCommand: pip install -r requirements.txt && python core/ingestion.py
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
